<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krauser Gestão - Clientes</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.topo{
background:#0B3D91;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
max-width:1400px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h3{
color:#0B3D91;
margin-bottom:10px;
}

input{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.btn{
background:#F29C1F;
color:white;
}

.btn-remover{
background:#dc3545;
color:white;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0B3D91;
color:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

.pesquisa{
margin-bottom:15px;
}

</style>
</head>

<body>

<div class="topo">
<h2>Krauser Gestão - Clientes</h2>
</div>

<div class="container">

<div class="card">

<h3>Novo Cliente</h3>

<div class="grid">

<input id="nome" placeholder="Nome Completo">

<input id="cpf" placeholder="CPF">

<input id="telefone" placeholder="Telefone">

</div>

<br>

<button class="btn" onclick="salvarCliente()">
💾 Salvar Cliente
</button>

</div>

<div class="card">

<h3>Pesquisar Cliente</h3>

<input
class="pesquisa"
id="pesquisa"
placeholder="Pesquisar por nome, CPF ou telefone"
onkeyup="listarClientes()">

<table>

<thead>
<tr>
<th>Nome</th>
<th>CPF</th>
<th>Telefone</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="listaClientes"></tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://fdqdbqoljhpzwlkgyddt.supabase.co";

const supabaseKey = "sb_publishable_d0pxxCOcLcLLcsmBxy0A0g_T805lPUg";

const supabase = window.supabase.createClient(
supabaseUrl,
supabaseKey
);

async function salvarCliente(){

const nome =
document.getElementById("nome").value.trim();

const cpf =
document.getElementById("cpf").value.trim();

const telefone =
document.getElementById("telefone").value.trim();

if(nome === ""){
alert("Informe o nome do cliente");
return;
}

const { error } = await supabase
.from("clientes")
.insert([
{
nome,
cpf,
telefone
}
]);

if(error){
alert("Erro ao salvar cliente");
console.log(error);
return;
}

document.getElementById("nome").value = "";
document.getElementById("cpf").value = "";
document.getElementById("telefone").value = "";

alert("Cliente cadastrado com sucesso!");

listarClientes();

}

async function excluirCliente(id){

if(!confirm("Deseja excluir este cliente?")){
return;
}

const { error } = await supabase
.from("clientes")
.delete()
.eq("id", id);

if(error){
alert("Erro ao excluir cliente");
console.log(error);
return;
}

listarClientes();

}

async function listarClientes(){

const pesquisa =
document.getElementById("pesquisa")
.value
.toLowerCase();

const { data, error } = await supabase
.from("clientes")
.select("*")
.order("id",{ascending:false});

if(error){
console.log(error);
return;
}

let clientes = data || [];

clientes = clientes.filter(cliente =>

(cliente.nome || "")
.toLowerCase()
.includes(pesquisa)

||

(cliente.cpf || "")
.toLowerCase()
.includes(pesquisa)

||

(cliente.telefone || "")
.toLowerCase()
.includes(pesquisa)

);

let html = "";

clientes.forEach(cliente=>{

html += `
<tr>

<td>${cliente.nome || ""}</td>

<td>${cliente.cpf || ""}</td>

<td>${cliente.telefone || ""}</td>

<td>

<button
class="btn-remover"
onclick="excluirCliente(${cliente.id})">

Excluir

</button>

</td>

</tr>
`;

});

document.getElementById(
"listaClientes"
).innerHTML = html;

}

listarClientes();

</script>

</body>
</html>
